version: 2
updates:
  # Java connectors — multi-module Maven reactor rooted at the repo root
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # Stay on the Quarkus 3.40 LTS line; patch releases (3.40.z) are fine
      - dependency-name: "io.quarkus.platform:quarkus-bom"
        versions: [">=3.41"]
      # camel-quarkus must stay aligned with the Quarkus platform version
      - dependency-name: "org.apache.camel.quarkus:camel-quarkus-bom"
        versions: [">=3.41"]

  # JSONata transformer — security fixes only; version-update PRs are paused
  # via limit 0, while Dependabot security updates (repo setting) keep flowing
  - package-ecosystem: "npm"
    directory: "/transform-jsonata"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
